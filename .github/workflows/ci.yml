name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BPF_LINKER_VERSION: v0.12.0

jobs:
  check:
    name: "fmt · clippy · test (unprivileged core: restrictions + seccomp + Landlock)"
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Kernel and LSMs
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
          cat /proc/sys/kernel/io_uring_disabled || true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (bypass suite, Landlock coverage, throughput)
        run: cargo test --workspace --all-targets --locked
      - name: Acceptance measurements
        run: |
          cargo build --release --locked --bin uring-gate
          echo '## probe'
          ./target/release/uring-gate probe
          echo '## bypass suite (acceptance: 0 gated escapes)'
          ./target/release/uring-gate bypass
          echo '## throughput (acceptance: >= 85% of native)'
          ./target/release/uring-gate bench --iters 1000000

  ebpf:
    name: build eBPF LSM object (nightly + bpf-linker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install bpf-linker
        run: |
          curl -sSfL -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build eBPF object
        working-directory: uring-gate-ebpf
        run: |
          bpf-linker --version
          cargo build --release --locked
          ls -l target/bpfel-unknown-none/release/uring-gate-ebpf
      - uses: actions/upload-artifact@v4
        with:
          name: uring-gate-ebpf
          path: uring-gate-ebpf/target/bpfel-unknown-none/release/uring-gate-ebpf
          if-no-files-found: error
