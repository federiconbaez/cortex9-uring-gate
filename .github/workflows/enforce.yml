name: Enforce (BPF-LSM)

# Real BPF-LSM enforcement test for the layer-3 backstop.
#
# This workflow FAILS when `bpf` is not in /sys/kernel/security/lsm. GitHub
# hosted runners build CONFIG_BPF_LSM=y but do not list `bpf` in the boot
# `lsm=`, so this workflow is red on purpose there: an attached hook that is
# never invoked proves nothing. There is no skip and no continue-on-error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BPF_LINKER_VERSION: v0.12.0

jobs:
  ebpf:
    name: build eBPF LSM object (nightly + bpf-linker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install bpf-linker
        run: |
          curl -sSfL -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build eBPF object
        working-directory: uring-gate-ebpf
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: uring-gate-ebpf-enforce
          path: uring-gate-ebpf/target/bpfel-unknown-none/release/uring-gate-ebpf
          if-no-files-found: error

  enforce:
    name: "BPF-LSM enforcement (sudo; fails if bpf is not an active LSM)"
    runs-on: ubuntu-latest
    needs: ebpf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: uring-gate-ebpf-enforce
          path: ebpf-obj
      - name: Build loader with the embedded object
        run: |
          export URING_GATE_EBPF_OBJ="$PWD/ebpf-obj/uring-gate-ebpf"
          cargo build --release --locked --features lsm --bin uring-gate-lsm
      - name: Measure enforcement (requires bpf in the active LSM list)
        run: |
          uname -r
          echo "active LSMs: $(cat /sys/kernel/security/lsm)"
          export URING_GATE_EBPF_OBJ="$PWD/ebpf-obj/uring-gate-ebpf"
          sudo -E ./target/release/uring-gate-lsm measure
